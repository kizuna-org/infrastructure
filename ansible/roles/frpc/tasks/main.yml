- name: Set frpclient directory path
  ansible.builtin.set_fact:
    frpclient_dir: "{{ ansible_env.HOME }}/fclient"

- name: List docker networks
  ansible.builtin.command:
    argv:
      - sudo
      - docker
      - network
      - ls
      - --format
      - "{% raw %}{{.Name}}{% endraw %}"
  register: docker_network_list
  changed_when: false

- name: Set kind network facts
  ansible.builtin.set_fact:
    kind_network_exists: "{{ kind_network_candidates | length > 0 }}"
    kind_network_name: "{{ kind_network_candidates | first | default('') }}"
  vars:
    kind_network_candidates: "{{ docker_network_list.stdout_lines | select('search', 'kind') | list }}"

- name: Debug kind network facts
  ansible.builtin.debug:
    msg: "kind_network_exists: {{ kind_network_exists }}, kind_network_name: {{ kind_network_name }}"

- name: Find all template files
  ansible.builtin.find:
    paths: "{{ role_path }}/templates/frpc"
    recurse: yes
    file_type: file
  register: template_files
  delegate_to: localhost
  run_once: true

- name: Template files individually
  ansible.builtin.template:
    src: "{{ item.path | replace(role_path + '/templates/', '') }}"
    dest: "{{ frpclient_dir }}/{{ item.path | replace(role_path + '/templates/frpc/', '') | regex_replace('\\.j2$', '') }}"
    mode: "0777"
  loop: "{{ template_files.files }}"
  loop_control:
    label: "{{ item.path | replace(role_path + '/templates/frpc/', '') | regex_replace('\\.j2$', '') }}"
  notify: Restart compose
