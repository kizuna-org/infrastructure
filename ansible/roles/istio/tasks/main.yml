- name: Get user home directory
  ansible.builtin.command: echo $HOME
  register: home_dir_result
  changed_when: false
  when: ansible_env.HOME is not defined

- name: Resolve user home directory
  ansible.builtin.set_fact:
    resolved_home: "{{ ansible_env.HOME | default(home_dir_result.stdout | default('')) }}"

- name: Set istioctl install path
  ansible.builtin.set_fact:
    istioctl_path: >-
      {{
        istioctl_install_path
        | default(resolved_home ~ '/.local/bin/istioctl')
      }}

- name: Get istioctl install directory from path
  ansible.builtin.set_fact:
    istioctl_install_dir: "{{ istioctl_path | dirname }}"

- name: Create istioctl install directory
  ansible.builtin.file:
    path: "{{ istioctl_install_dir }}"
    state: directory
    mode: '0755'

- name: Load VPN variables from vars/main/main.yml
  ansible.builtin.include_tasks: load_vars.yml
  when: istio_egress_vpn_enabled | default(false)

- name: Include common proxy environment task
  ansible.builtin.include_tasks: ../../tasks/build_proxy_env.yml
  vars:
    proxy_env_var_name: istio_proxy_env
    http_proxy_value: "{{ istio_http_proxy | default('') }}"
    https_proxy_value: "{{ istio_https_proxy | default('') }}"
    no_proxy_value: "{{ istio_no_proxy | default('') }}"
    install_dir: "{{ istioctl_install_dir }}"

- name: Display proxy environment
  ansible.builtin.debug:
    var: istio_proxy_env

- name: Determine OS and architecture
  ansible.builtin.set_fact:
    istio_os: "{{ 'osx' if ansible_system == 'Darwin' else 'linux' }}"
    istio_arch: "{{ 'amd64' if ansible_architecture in ['x86_64', 'amd64'] else 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"

- name: Download istioctl binary
  ansible.builtin.get_url:
    url: "https://github.com/istio/istio/releases/download/{{ istio_version }}/istioctl-{{ istio_version }}-{{ istio_os }}-{{ istio_arch }}.tar.gz"
    dest: "/tmp/istioctl-{{ istio_version }}.tar.gz"
    mode: '0644'
  environment: "{{ istio_proxy_env }}"

- name: Extract istioctl binary
  ansible.builtin.unarchive:
    src: "/tmp/istioctl-{{ istio_version }}.tar.gz"
    dest: "{{ istioctl_install_dir }}"
    remote_src: yes
    mode: '0755'

- name: Verify istioctl installation
  ansible.builtin.command: "{{ istioctl_path }} version --remote=false"
  register: istioctl_version_output
  changed_when: false
  environment: "{{ istio_proxy_env }}"

- name: Display istioctl version
  ansible.builtin.debug:
    var: istioctl_version_output.stdout

- name: Set kubeconfig path
  ansible.builtin.set_fact:
    kubeconfig_path: "{{ resolved_home }}/.kube/config"

- name: Set cluster context
  ansible.builtin.set_fact:
    target_cluster_name: "{{ kind_cluster_name | default('kind') }}"
    kube_context: "kind-{{ kind_cluster_name | default('kind') }}"

- name: Check if Istio is already installed
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - get
      - namespace
      - istio-system
      - --context
      - "{{ kube_context }}"
  register: istio_check
  changed_when: false
  failed_when: false
  environment: "{{ istio_proxy_env }}"

- name: Set Istio installation status
  ansible.builtin.set_fact:
    istio_installed: "{{ istio_check.rc == 0 }}"

- name: Display Istio installation status
  ansible.builtin.debug:
    msg: "Istio is {{ 'already installed' if istio_installed else 'not installed' }}"

- name: Create temporary manifest directory
  ansible.builtin.file:
    path: "{{ resolved_home }}/.cache/istio/manifests"
    state: directory
    mode: '0755'
  when: not istio_installed

- name: Generate Istio installation manifest
  ansible.builtin.command:
    argv:
      - "{{ istioctl_path }}"
      - manifest
      - generate
      - --set
      - profile={{ istio_profile }}
      - --set
      - components.egressGateways[0].name=istio-egressgateway
      - --set
      - components.egressGateways[0].enabled=true
      - --set
      - meshConfig.outboundTrafficPolicy.mode=REGISTRY_ONLY
  register: istio_manifest
  changed_when: false
  environment: "{{ istio_proxy_env }}"
  when: not istio_installed

- name: Save Istio manifest to file
  ansible.builtin.copy:
    content: "{{ istio_manifest.stdout }}"
    dest: "{{ resolved_home }}/.cache/istio/manifests/istio-install.yaml"
    mode: '0644'
  when: not istio_installed

- name: Ensure Istio namespace exists
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - create
      - namespace
      - istio-system
      - --context
      - "{{ kube_context }}"
  register: istio_namespace_result
  changed_when: "'created' in istio_namespace_result.stdout"
  failed_when:
    - istio_namespace_result.rc != 0
    - "'AlreadyExists' not in istio_namespace_result.stderr"
  environment: "{{ istio_proxy_env }}"
  when: not istio_installed

- name: Apply Istio installation manifest
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -v
      - "{{ resolved_home }}/.cache/istio/manifests:/manifests:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - apply
      - -f
      - /manifests/istio-install.yaml
      - --context
      - "{{ kube_context }}"
  register: istio_install_result
  changed_when: "'created' in istio_install_result.stdout or 'configured' in istio_install_result.stdout"
  environment: "{{ istio_proxy_env }}"
  when: not istio_installed

- name: Display Istio installation result
  ansible.builtin.debug:
    var: istio_install_result.stdout_lines
  when: not istio_installed and istio_install_result.changed

- name: Wait for Istio control plane to be ready
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - wait
      - --for=condition=available
      - --timeout=300s
      - deployment/istiod
      - -n
      - istio-system
      - --context
      - "{{ kube_context }}"
  register: istio_ready
  changed_when: false
  environment: "{{ istio_proxy_env }}"
  retries: 3
  delay: 10
  until: istio_ready.rc == 0

- name: Generate Tailscale RBAC configuration
  ansible.builtin.template:
    src: tailscale-rbac.yaml.j2
    dest: "{{ resolved_home }}/.cache/istio/manifests/tailscale-rbac.yaml"
    mode: '0644'
  register: tailscale_rbac_template
  when: istio_egress_vpn_enabled | default(false)

- name: Apply Tailscale RBAC configuration
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -v
      - "{{ resolved_home }}/.cache/istio/manifests:/manifests:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - apply
      - -f
      - /manifests/tailscale-rbac.yaml
      - --context
      - "{{ kube_context }}"
  register: tailscale_rbac_result
  changed_when: >
    (tailscale_rbac_result.stdout is defined) and
    ('created' in tailscale_rbac_result.stdout or 'configured' in tailscale_rbac_result.stdout or 'unchanged' in tailscale_rbac_result.stdout)
  environment: "{{ istio_proxy_env }}"
  when:
    - istio_egress_vpn_enabled | default(false)
    - tailscale_rbac_template is defined

- name: Wait for Istio egress gateway to be ready
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - wait
      - --for=condition=available
      - --timeout=300s
      - deployment/istio-egressgateway
      - -n
      - istio-system
      - --context
      - "{{ kube_context }}"
  register: egress_ready
  changed_when: false
  environment: "{{ istio_proxy_env }}"
  retries: 3
  delay: 10
  until: egress_ready.rc == 0
  when: not (istio_egress_vpn_enabled | default(false))

- name: Generate egress gateway configuration
  ansible.builtin.template:
    src: egress-gateway.yaml.j2
    dest: "{{ resolved_home }}/.cache/istio/manifests/egress-gateway.yaml"
    mode: '0644'

- name: Generate proxy ServiceEntry configuration
  ansible.builtin.template:
    src: proxy-serviceentry.yaml.j2
    dest: "{{ resolved_home }}/.cache/istio/manifests/proxy-serviceentry.yaml"
    mode: '0644'

- name: Generate internal ServiceEntry configuration
  ansible.builtin.template:
    src: internal-serviceentry.yaml.j2
    dest: "{{ resolved_home }}/.cache/istio/manifests/internal-serviceentry.yaml"
    mode: '0644'

- name: Apply egress gateway configuration
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -v
      - "{{ resolved_home }}/.cache/istio/manifests:/manifests:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - apply
      - -f
      - /manifests/egress-gateway.yaml
      - --context
      - "{{ kube_context }}"
  register: egress_config_result
  changed_when: "'created' in egress_config_result.stdout or 'configured' in egress_config_result.stdout"
  environment: "{{ istio_proxy_env }}"

- name: Apply proxy ServiceEntry configuration
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -v
      - "{{ resolved_home }}/.cache/istio/manifests:/manifests:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - apply
      - -f
      - /manifests/proxy-serviceentry.yaml
      - --context
      - "{{ kube_context }}"
  register: proxy_se_result
  changed_when: "'created' in proxy_se_result.stdout or 'configured' in proxy_se_result.stdout"
  environment: "{{ istio_proxy_env }}"

- name: Apply internal ServiceEntry configuration
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -v
      - "{{ resolved_home }}/.cache/istio/manifests:/manifests:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - apply
      - -f
      - /manifests/internal-serviceentry.yaml
      - --context
      - "{{ kube_context }}"
  register: internal_se_result
  changed_when: "'created' in internal_se_result.stdout or 'configured' in internal_se_result.stdout"
  environment: "{{ istio_proxy_env }}"

- name: Check for Tailscale auth Secret in {{ tailscale_secret_namespace }}
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - get
      - secret
      - "{{ tailscale_k8s_secret_name }}"
      - -n
      - "{{ tailscale_secret_namespace }}"
      - --context
      - "{{ kube_context }}"
  register: tailscale_secret_check
  changed_when: false
  failed_when: false
  environment: "{{ istio_proxy_env }}"
  when: istio_egress_vpn_enabled | default(false)

- name: Generate Tailscale auth Secret manifest
  ansible.builtin.copy:
    content: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ tailscale_k8s_secret_name }}
        namespace: {{ tailscale_secret_namespace }}
      stringData:
        authkey: "{{ istio_tailscale_auth_key }}"
      type: Opaque
    dest: "{{ resolved_home }}/.cache/istio/manifests/tailscale-secret.yaml"
    mode: '0644'
  when:
    - istio_egress_vpn_enabled | default(false)
    - istio_tailscale_auth_key is defined
    - (istio_tailscale_auth_key | default('')) | length > 0

- name: Apply Tailscale auth Secret
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -v
      - "{{ resolved_home }}/.cache/istio/manifests:/manifests:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - apply
      - -f
      - /manifests/tailscale-secret.yaml
      - --context
      - "{{ kube_context }}"
  register: tailscale_secret_apply
  changed_when: "'configured' in tailscale_secret_apply.stdout or 'created' in tailscale_secret_apply.stdout"
  environment: "{{ istio_proxy_env }}"
  when:
    - istio_egress_vpn_enabled | default(false)
    - istio_tailscale_auth_key is defined
    - (istio_tailscale_auth_key | default('')) | length > 0

- name: Fail if Tailscale auth Secret is missing and auth_key is not provided
  ansible.builtin.fail:
    msg: >-
      Required Secret "{{ tailscale_k8s_secret_name }}" was not found in namespace
      "{{ tailscale_secret_namespace }}", and istio_tailscale_auth_key is not set in vars.
      Please either:
      1. Create the Secret manually (e.g. kubectl create secret generic {{ tailscale_k8s_secret_name }} -n {{ tailscale_secret_namespace }} --from-literal=authkey=<tskey-xxxx>), or
      2. Set istio_tailscale_auth_key in group_vars/all.yml or encrypted vars.
  when:
    - istio_egress_vpn_enabled | default(false)
    - tailscale_secret_check is defined
    - tailscale_secret_check.rc != 0
    - not (istio_tailscale_auth_key is defined and (istio_tailscale_auth_key | default('')) | length > 0)

- name: Get current Egress Gateway deployment
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - get
      - deployment
      - istio-egressgateway
      - -n
      - istio-system
      - -o
      - json
      - --context
      - "{{ kube_context }}"
  register: egress_deployment_get
  changed_when: false
  environment: "{{ istio_proxy_env }}"
  failed_when: false

- name: Parse Egress Gateway deployment JSON
  ansible.builtin.set_fact:
    egress_deployment_json: "{{ egress_deployment_get.stdout | from_json }}"
  when:
    - egress_deployment_get is defined
    - egress_deployment_get.rc == 0
    - egress_deployment_get.stdout is defined
    - egress_deployment_get.stdout | length > 0

- name: Filter out openconnect container from deployment
  ansible.builtin.set_fact:
    filtered_containers: "{{ egress_deployment_json.spec.template.spec.containers | selectattr('name', 'ne', 'openconnect') | list }}"
    has_openconnect: "{{ egress_deployment_json.spec.template.spec.containers | selectattr('name', 'equalto', 'openconnect') | list | length > 0 }}"
  when:
    - egress_deployment_json is defined

- name: Remove openconnect container from Egress Gateway
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - patch
      - deployment
      - istio-egressgateway
      - -n
      - istio-system
      - --type
      - merge
      - --patch
      - "{{ {'spec': {'template': {'spec': {'containers': filtered_containers}}}} | to_json }}"
      - --context
      - "{{ kube_context }}"
  register: remove_openconnect_result
  changed_when: >
    (remove_openconnect_result.stdout is defined) and
    ('patched' in remove_openconnect_result.stdout or 'deployment.apps/istio-egressgateway patched' in remove_openconnect_result.stdout)
  environment: "{{ istio_proxy_env }}"
  when:
    - egress_deployment_get is defined
    - egress_deployment_get.rc == 0
    - filtered_containers is defined
    - has_openconnect | default(false) | bool

- name: Check if Egress Gateway deployment exists
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - get
      - deployment
      - istio-egressgateway
      - -n
      - istio-system
      - --context
      - "{{ kube_context }}"
  register: egress_deployment_check
  changed_when: false
  failed_when: false
  environment: "{{ istio_proxy_env }}"
  when: istio_egress_vpn_enabled | default(false)

- name: Set egress gateway exists flag
  ansible.builtin.set_fact:
    egress_gateway_exists: "{{ egress_deployment_check.rc == 0 }}"
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_deployment_check is defined

- name: Generate Egress Gateway manifest using istioctl
  ansible.builtin.command:
    argv:
      - "{{ istioctl_path }}"
      - manifest
      - generate
      - --set
      - profile={{ istio_profile }}
      - --set
      - components.egressGateways[0].name=istio-egressgateway
      - --set
      - components.egressGateways[0].enabled=true
  register: egress_manifest_generate
  changed_when: false
  environment: "{{ istio_proxy_env }}"
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_gateway_exists | default(false) | bool == false

- name: Save full Egress Gateway manifest to file
  ansible.builtin.copy:
    content: "{{ egress_manifest_generate.stdout }}"
    dest: "{{ resolved_home }}/.cache/istio/manifests/egress-gateway-full.yaml"
    mode: '0644'
  register: egress_manifest_file
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_gateway_exists | default(false) | bool == false
    - egress_manifest_generate is defined
    - egress_manifest_generate.rc == 0

- name: Extract Egress Gateway resources from full manifest
  ansible.builtin.shell: |
    # Extract complete resources (ServiceAccount, Service, Deployment) for istio-egressgateway
    # Split by --- and extract resources that contain istio-egressgateway
    awk '
    BEGIN {
      RS = "\n---\n"
      ORS = "\n---\n"
    }
    {
      if ($0 ~ /kind: (ServiceAccount|Service|Deployment)/ && $0 ~ /name: istio-egressgateway/) {
        print $0
      }
    }
    END {
      if (NR > 0) {
        print ""
      }
    }
    ' "{{ resolved_home }}/.cache/istio/manifests/egress-gateway-full.yaml" | \
    sed '1s/^/---\n/' | \
    sed '$a---'
  register: egress_resources_extracted
  changed_when: false
  args:
    executable: /bin/bash
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_gateway_exists | default(false) | bool == false
    - egress_manifest_file is defined

- name: Save extracted Egress Gateway resources to file
  ansible.builtin.copy:
    content: "{{ egress_resources_extracted.stdout }}"
    dest: "{{ resolved_home }}/.cache/istio/manifests/egress-gateway-resources.yaml"
    mode: '0644'
  register: egress_resources_file
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_gateway_exists | default(false) | bool == false
    - egress_resources_extracted is defined
    - egress_resources_extracted.stdout is defined
    - egress_resources_extracted.stdout | length > 0

- name: Apply Egress Gateway resources
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -v
      - "{{ resolved_home }}/.cache/istio/manifests:/manifests:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - apply
      - -f
      - /manifests/egress-gateway-resources.yaml
      - --context
      - "{{ kube_context }}"
  register: egress_deployment_apply
  changed_when: >
    (egress_deployment_apply.stdout is defined) and
    ('created' in egress_deployment_apply.stdout or 'configured' in egress_deployment_apply.stdout or 'unchanged' in egress_deployment_apply.stdout)
  environment: "{{ istio_proxy_env }}"
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_gateway_exists | default(false) | bool == false
    - egress_resources_file is defined

- name: Wait for Egress Gateway to be ready
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - wait
      - --for=condition=available
      - --timeout=300s
      - deployment/istio-egressgateway
      - -n
      - istio-system
      - --context
      - "{{ kube_context }}"
  register: egress_ready_vpn
  changed_when: false
  environment: "{{ istio_proxy_env }}"
  retries: 3
  delay: 10
  until: egress_ready_vpn.rc == 0
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_gateway_exists | default(false) | bool == false
    - egress_deployment_apply is defined

- name: Generate Egress Gateway VPN patch configuration
  ansible.builtin.template:
    src: egress-gateway-vpn-patch.yaml.j2
    dest: "{{ resolved_home }}/.cache/istio/manifests/egress-gateway-vpn-patch.yaml"
    mode: '0644'
  register: egress_vpn_patch_template
  when: istio_egress_vpn_enabled | default(false)

- name: Get current Egress Gateway containers before VPN patch
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - get
      - deployment
      - istio-egressgateway
      - -n
      - istio-system
      - -o
      - json
      - --context
      - "{{ kube_context }}"
  register: egress_deployment_before_patch
  changed_when: false
  environment: "{{ istio_proxy_env }}"
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_vpn_patch_template is defined

- name: Extract existing containers from Egress Gateway
  ansible.builtin.set_fact:
    existing_egress_containers: "{{ egress_deployment_before_patch.stdout | from_json | json_query('spec.template.spec.containers') }}"
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_vpn_patch_template is defined
    - egress_deployment_before_patch is defined
    - egress_deployment_before_patch.rc == 0

- name: Filter out existing tailscale-vpn container
  ansible.builtin.set_fact:
    filtered_egress_containers: "{{ existing_egress_containers | selectattr('name', 'ne', 'tailscale-vpn') | list }}"
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_vpn_patch_template is defined
    - existing_egress_containers is defined

- name: Read VPN patch YAML file from remote host
  ansible.builtin.slurp:
    src: "{{ resolved_home }}/.cache/istio/manifests/egress-gateway-vpn-patch.yaml"
  register: vpn_patch_file_content
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_vpn_patch_template is defined
    - existing_egress_containers is defined

- name: Load VPN patch YAML and extract tailscale container
  ansible.builtin.set_fact:
    tailscale_container: "{{ (vpn_patch_file_content.content | b64decode | from_yaml | json_query('spec.template.spec.containers[0]')) }}"
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_vpn_patch_template is defined
    - existing_egress_containers is defined
    - vpn_patch_file_content is defined
    - vpn_patch_file_content.content is defined

- name: Merge existing containers with Tailscale container
  ansible.builtin.set_fact:
    merged_containers: "{{ filtered_egress_containers | default(existing_egress_containers) + [tailscale_container] }}"
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_vpn_patch_template is defined
    - existing_egress_containers is defined
    - tailscale_container is defined

- name: Get existing volumes from Egress Gateway
  ansible.builtin.set_fact:
    existing_egress_volumes: "{{ egress_deployment_before_patch.stdout | from_json | json_query('spec.template.spec.volumes') | default([]) }}"
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_vpn_patch_template is defined
    - merged_containers is defined
    - egress_deployment_before_patch is defined
    - egress_deployment_before_patch.rc == 0

- name: Filter out existing Tailscale volumes
  ansible.builtin.set_fact:
    filtered_egress_volumes: "{{ existing_egress_volumes | default([]) | selectattr('name', 'ne', 'dev-net-tun') | selectattr('name', 'ne', 'tailscale-state') | list }}"
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_vpn_patch_template is defined
    - merged_containers is defined
    - existing_egress_volumes is defined

- name: Merge existing volumes with Tailscale volumes
  ansible.builtin.set_fact:
    merged_volumes: "{{ filtered_egress_volumes | default(existing_egress_volumes | default([])) + [{'name': 'dev-net-tun', 'hostPath': {'path': '/dev/net/tun', 'type': 'CharDevice'}}, {'name': 'tailscale-state', 'emptyDir': {}}] }}"
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_vpn_patch_template is defined
    - merged_containers is defined
    - existing_egress_volumes is defined

- name: Apply Egress Gateway VPN patch with merged containers
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - patch
      - deployment
      - istio-egressgateway
      - -n
      - istio-system
      - --type
      - merge
      - --patch
      - "{{ {'spec': {'template': {'metadata': {'annotations': {'proxy.istio.io/config': 'proxyMetadata:\n  ISTIO_META_OUTBOUND_TRAFFIC_POLICY: ALLOW_ANY'}}, 'spec': {'containers': merged_containers, 'volumes': merged_volumes, 'shareProcessNamespace': True}}}} | to_json }}"
      - --context
      - "{{ kube_context }}"
  register: egress_vpn_patch_result
  changed_when: >
    (egress_vpn_patch_result.stdout is defined) and
    ('patched' in egress_vpn_patch_result.stdout or 'deployment.apps/istio-egressgateway patched' in egress_vpn_patch_result.stdout)
  environment: "{{ istio_proxy_env }}"
  when:
    - istio_egress_vpn_enabled | default(false)
    - egress_vpn_patch_template is defined
    - merged_containers is defined
    - merged_volumes is defined

- name: Get all namespaces for Istio injection
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - get
      - namespaces
      - -o
      - jsonpath={.items[*].metadata.name}
      - --context
      - "{{ kube_context }}"
  register: all_namespaces
  changed_when: false
  environment: "{{ istio_proxy_env }}"

- name: Enable Istio injection for all appropriate namespaces
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - label
      - namespace
      - "{{ item }}"
      - istio-injection=enabled
      - --overwrite
      - --context
      - "{{ kube_context }}"
  register: injection_result
  changed_when: "'labeled' in injection_result.stdout"
  environment: "{{ istio_proxy_env }}"
  loop: "{{ all_namespaces.stdout.split() }}"
  when:
    - item != 'istio-system'
    - item != 'kube-public'
    - item != 'kube-node-lease'
    - item != 'local-path-storage'
  ignore_errors: true

- name: Ensure manifest directory exists for argocd sidecar
  ansible.builtin.file:
    path: "{{ resolved_home }}/.cache/istio/manifests"
    state: directory
    mode: '0755'

- name: Set argocd sidecar manifest path
  ansible.builtin.set_fact:
    argocd_sidecar_manifest_path: "{{ resolved_home }}/.cache/istio/manifests/argocd-sidecar.yaml"

- name: Render argocd Sidecar configuration
  ansible.builtin.template:
    src: argocd-sidecar.yaml.j2
    dest: "{{ argocd_sidecar_manifest_path }}"
    mode: '0644'
  register: argocd_sidecar_template

- name: Create Sidecar configuration for argocd namespace to allow Kubernetes API access
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -v
      - "{{ resolved_home }}/.cache/istio/manifests:/manifests:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - apply
      - -f
      - /manifests/argocd-sidecar.yaml
      - --context
      - "{{ kube_context }}"
  register: argocd_sidecar_result
  changed_when: "'created' in argocd_sidecar_result.stdout or 'configured' in argocd_sidecar_result.stdout"
  environment: "{{ istio_proxy_env }}"



- name: Label argocd services for Kiali application recognition
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - label
      - service
      - "{{ item }}"
      - -n
      - argocd
      - app={{ item | regex_replace('^argocd-', '') }}
      - --overwrite
      - --context
      - "{{ kube_context }}"
  register: argocd_service_label_result
  changed_when: "'labeled' in argocd_service_label_result.stdout"
  failed_when: false
  environment: "{{ istio_proxy_env }}"
  loop:
    - argocd-server
    - argocd-repo-server
    - argocd-dex-server
    - argocd-redis
    - argocd-notifications-controller
    - argocd-applicationset-controller
  ignore_errors: true

- name: Label argocd application-controller service for Kiali
  ansible.builtin.command:
    argv:
      - docker
