    ('patched' in argocd_app_controller_sidecar_disable_result.stdout or 'unchanged' not in argocd_app_controller_sidecar_disable_result.stdout)
  failed_when: false
  environment: "{{ istio_proxy_env }}"
  ignore_errors: true
  when: argocd_disable_sidecar_injection | default(false)

- name: Restart deployments in injected namespaces
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - rollout
      - restart
      - deployment
      - -n
      - "{{ item }}"
      - --context
      - "{{ kube_context }}"
  environment: "{{ istio_proxy_env }}"
  loop: "{{ all_namespaces.stdout.split() }}"
  when:
    - item != 'istio-system'
    - item != 'kube-public'
    - item != 'kube-node-lease'
    - item != 'local-path-storage'
  ignore_errors: true

- name: Restart statefulsets in injected namespaces
  ansible.builtin.command:
    argv:
