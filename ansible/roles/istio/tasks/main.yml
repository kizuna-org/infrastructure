      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - label
      - deployment
      - "{{ item }}"
      - -n
      - argocd
      - app={{ item | regex_replace('^argocd-', '') }}
      - --overwrite
      - --context
      - "{{ kube_context }}"
  register: argocd_deployment_label_result
  changed_when: "'labeled' in argocd_deployment_label_result.stdout"
  failed_when: false
  environment: "{{ istio_proxy_env }}"
  loop:
    - argocd-server
    - argocd-repo-server
    - argocd-dex-server
    - argocd-redis
    - argocd-notifications-controller
    - argocd-applicationset-controller
  ignore_errors: true

- name: Add app and version labels to argocd deployment pod templates
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - -v
      - "{{ kubeconfig_path }}:/root/.kube/config:ro"
      - -u
      - "0:0"
      - -e
      - KUBECONFIG=/root/.kube/config
      - "{{ kubectl_container_image }}"
      - patch
      - deployment
      - "{{ item }}"
      - -n
      - argocd
      - --type
      - merge
      - -p
      - >-
        {
          "spec": {
            "template": {
              "metadata": {
                "labels": {
                  "app": "{{ item | regex_replace('^argocd-', '') }}",
                  "version": "v1"
                }
              }
            }
          }
        }
      - --context
      - "{{ kube_context }}"
  register: argocd_deployment_template_label_result
  changed_when: >
    (argocd_deployment_template_label_result.stdout is defined) and
    ('patched' in argocd_deployment_template_label_result.stdout or 'unchanged' not in argocd_deployment_template_label_result.stdout)
  failed_when: false
  environment: "{{ istio_proxy_env }}"
  loop:
    - argocd-server
    - argocd-repo-server
    - argocd-dex-server
    - argocd-redis
    - argocd-notifications-controller
    - argocd-applicationset-controller
  ignore_errors: true

