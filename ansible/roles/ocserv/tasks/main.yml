---
- name: Ensure ocserv variables are provided
  ansible.builtin.assert:
    that:
      - ocserv_users is defined
      - ocserv_users | length > 0
    fail_msg: "ocserv_users must contain at least one account definition"

- name: Ensure ocserv directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ ocserv_base_dir }}"
    - "{{ ocserv_config_dir }}"

- name: Validate tls certificate path exists
  ansible.builtin.stat:
    path: "{{ item }}"
  register: ocserv_cert_paths
  loop:
    - "{{ ocserv_tls_cert_src }}"
    - "{{ ocserv_tls_key_src }}"

- name: Fail when tls assets are missing
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "Missing TLS asset at {{ item.stat.path }}"
  loop: "{{ ocserv_cert_paths.results }}"

- name: Deploy ocserv.conf
  become: true
  ansible.builtin.template:
    src: ocserv.conf.j2
    dest: "{{ ocserv_config_dir }}/ocserv.conf"
    mode: "0640"
  notify: Restart ocserv docker compose

- name: Deploy ocpasswd
  become: true
  ansible.builtin.template:
    src: ocpasswd.j2
    dest: "{{ ocserv_config_dir }}/ocpasswd"
    mode: "0600"
  no_log: true
  notify: Restart ocserv docker compose

- name: Deploy docker compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ ocserv_base_dir }}/compose.yaml"
    mode: "0644"
  notify: Restart ocserv docker compose

- name: Check if docker compose is installed
  ansible.builtin.command: docker compose version
  register: ocserv_docker_compose_check
  changed_when: false
  failed_when: false

- name: Fail if docker compose is not installed
  ansible.builtin.fail:
    msg: "docker compose is not installed on target host"
  when: ocserv_docker_compose_check.rc != 0

- name: Show ocserv docker compose status
  become: true
  ansible.builtin.command:
    cmd: docker compose ps
    chdir: "{{ ocserv_base_dir }}"
  register: ocserv_compose_status
  changed_when: false

- name: Display ocserv services status
  ansible.builtin.debug:
    var: ocserv_compose_status.stdout_lines
