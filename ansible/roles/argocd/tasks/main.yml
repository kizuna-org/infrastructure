- name: Get user home directory
  ansible.builtin.command: echo $HOME
  register: home_dir_result
  changed_when: false
  when: ansible_env.HOME is not defined

- name: Resolve user home directory
  ansible.builtin.set_fact:
    resolved_home: "{{ ansible_env.HOME | default(home_dir_result.stdout | default('')) }}"

- name: Include common proxy environment task
  ansible.builtin.include_tasks: ../../tasks/build_proxy_env.yml
  vars:
    proxy_env_var_name: argocd_proxy_env
    http_proxy_value: "{{ argocd_http_proxy | default('') }}"
    https_proxy_value: "{{ argocd_https_proxy | default('') }}"
    no_proxy_value: "{{ argocd_no_proxy | default('') }}"

- name: Configure ArgoCD installation settings
  ansible.builtin.set_fact:
    install_argocd: "{{ (argocd_install | default(true)) | bool }}"
    argocd_manifest_url: "{{ argocd_manifest_url_input | default('https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml') }}"
    argocd_manifest_dir: "{{ resolved_home }}/.cache/argocd"
    argocd_manifest_path: "{{ resolved_home }}/.cache/argocd/install.yaml"
    kubeconfig_path: "{{ resolved_home }}/.kube/config"
    target_cluster_name: "{{ kind_cluster_name | default('kind') }}"

- name: Ensure ArgoCD manifest directory exists
  ansible.builtin.file:
    path: "{{ argocd_manifest_dir }}"
    state: directory
    mode: '0755'
  when: install_argocd

- name: Check if ArgoCD manifest exists
  ansible.builtin.stat:
    path: "{{ argocd_manifest_path }}"
  register: argocd_manifest_stat
  when: install_argocd

- name: Download ArgoCD manifest
  ansible.builtin.get_url:
    url: "{{ argocd_manifest_url }}"
    dest: "{{ argocd_manifest_path }}"
    mode: '0644'
  when:
    - install_argocd
    - not argocd_manifest_stat.stat.exists | default(false)
  environment: "{{ argocd_proxy_env }}"

- name: Initialise kubectl environment arguments for docker
  ansible.builtin.set_fact:
    kubectl_env_args: []
  when: install_argocd

- name: Append proxy variables to kubectl docker arguments
  ansible.builtin.set_fact:
    kubectl_env_args: "{{ kubectl_env_args + ['-e', item.key ~ '=' ~ item.value] }}"
  loop: "{{ argocd_proxy_env | dict2items | list }}"
  when: install_argocd

- name: Build kubectl docker command prefix
  ansible.builtin.set_fact:
    kubectl_base_command: >-
      {{
        [
          'sudo',
          'docker',
          'run',
          '--rm',
          '--network',
          'host',
          '-v',
          kubeconfig_path ~ ':/root/.kube/config:ro',
          '-v',
          argocd_manifest_dir ~ ':/workspace:ro',
          '-u',
          '0:0'
        ]
        + kubectl_env_args
        + [kubectl_container_image | default('rancher/kubectl:v1.30.3')]
      }}
  when: install_argocd

- name: Check if ArgoCD namespace exists
  ansible.builtin.command:
    argv: "{{ kubectl_base_command + ['get', 'namespace', 'argocd'] }}"
  register: argocd_namespace_check
  changed_when: false
  failed_when: argocd_namespace_check.rc not in [0, 1]
  environment: "{{ argocd_proxy_env }}"
  when: install_argocd

- name: Create ArgoCD namespace
  ansible.builtin.command:
    argv: "{{ kubectl_base_command + ['create', 'namespace', 'argocd'] }}"
  register: argocd_namespace_create
  environment: "{{ argocd_proxy_env }}"
  when:
    - install_argocd
    - argocd_namespace_check.rc != 0

- name: Apply ArgoCD core manifests
  ansible.builtin.command:
    argv: "{{ kubectl_base_command + ['apply', '-n', 'argocd', '-f', '/workspace/install.yaml'] }}"
  register: argocd_apply
  changed_when: >
    (argocd_apply.stdout is defined) and
    (argocd_apply.stdout | regex_search('(created|configured)') is not none)
  environment: "{{ argocd_proxy_env }}"
  when: install_argocd

- name: Initialise ArgoCD proxy CLI environment args
  ansible.builtin.set_fact:
    argocd_proxy_env_cli_args: []
  when: install_argocd

- name: Collect ArgoCD proxy CLI environment args
  ansible.builtin.set_fact:
    argocd_proxy_env_cli_args: "{{ argocd_proxy_env_cli_args + [item.key ~ '=' ~ item.value | string] }}"
  loop: "{{ argocd_proxy_env | dict2items | list }}"
  when:
    - install_argocd
    - item.key in proxy_env_keys
    - item.value is defined
    - (item.value | string | length) > 0
  vars:
    proxy_env_keys:
      - HTTP_PROXY
      - HTTPS_PROXY
      - NO_PROXY
      - http_proxy
      - https_proxy
      - no_proxy

- name: Define ArgoCD workloads requiring proxy settings
  ansible.builtin.set_fact:
    argocd_proxy_workloads:
      - {resource: 'deployment/argocd-server', container: 'argocd-server'}
      - {resource: 'deployment/argocd-repo-server', container: 'argocd-repo-server'}
      - {resource: 'deployment/argocd-applicationset-controller', container: 'argocd-applicationset-controller'}
      - {resource: 'deployment/argocd-notifications-controller', container: 'argocd-notifications-controller'}
      - {resource: 'statefulset/argocd-application-controller', container: 'argocd-application-controller'}
  when: install_argocd

- name: Apply proxy environment variables to ArgoCD workloads
  ansible.builtin.command:
    argv: "{{ base_set_env_cmd + container_args + argocd_proxy_env_cli_args }}"
  loop: "{{ argocd_proxy_workloads | default([]) }}"
  register: argocd_proxy_set_env
  changed_when: >
    (argocd_proxy_set_env.stdout is defined)
    and ('env updated' in argocd_proxy_set_env.stdout)
  when:
    - install_argocd
    - (argocd_proxy_env_cli_args | default([])) | length > 0
  vars:
    base_set_env_cmd: "{{ kubectl_base_command + ['set', 'env', item.resource, '-n', 'argocd'] }}"
    container_args: "{{ ['--containers', item.container] if item.container | default('') | length > 0 else [] }}"

- name: Wait for ArgoCD deployments to become available
  ansible.builtin.command:
    argv: "{{ kubectl_base_command + ['wait', '--for=condition=Available', '--namespace', 'argocd', 'deployment', '--all', '--timeout=600s'] }}"
  register: argocd_wait
  changed_when: false
  environment: "{{ argocd_proxy_env }}"
  when: install_argocd

- name: Display ArgoCD deployment status
  ansible.builtin.command:
    argv: "{{ kubectl_base_command + ['get', 'deployments', '--namespace', 'argocd'] }}"
  register: argocd_deployments
  changed_when: false
  environment: "{{ argocd_proxy_env }}"
  when: install_argocd

- name: Show ArgoCD deployments
  ansible.builtin.debug:
    var: argocd_deployments.stdout_lines
  when: install_argocd

- name: Get current ArgoCD server service type
  ansible.builtin.command:
    argv: "{{ kubectl_base_command + ['get', 'service', 'argocd-server', '-n', 'argocd', '-o', 'jsonpath={.spec.type}'] }}"
  register: argocd_service_type
  changed_when: false
  environment: "{{ argocd_proxy_env }}"
  when: install_argocd

- name: Patch ArgoCD server service to NodePort
  ansible.builtin.command:
    argv: >-
      {{
        kubectl_base_command
        + [
          'patch',
          'service',
          'argocd-server',
          '-n',
          'argocd',
          '--type',
          'json',
          '-p',
          '[{"op": "replace", "path": "/spec/type", "value": "NodePort"}]'
        ]
      }}
  register: argocd_service_patch
  changed_when: >
    (argocd_service_patch.stdout is defined) and
    ('patched' in argocd_service_patch.stdout or 'unchanged' not in argocd_service_patch.stdout)
  environment: "{{ argocd_proxy_env }}"
  when:
    - install_argocd
    - argocd_service_type.stdout != "NodePort"

- name: Get NodePort port number
  ansible.builtin.command:
    argv: "{{ kubectl_base_command + ['get', 'service', 'argocd-server', '-n', 'argocd', '-o', 'jsonpath={.spec.ports[0].nodePort}'] }}"
  register: argocd_nodeport
  changed_when: false
  environment: "{{ argocd_proxy_env }}"
  when: install_argocd

- name: Display port mapping information
  ansible.builtin.debug:
    msg: >-
      ArgoCD server service has been changed to NodePort.
      NodePort: {{ argocd_nodeport.stdout }}
      Note: To access ArgoCD on port 8080 from outside the kind cluster,
      the kind cluster must be created with extraPortMappings configured
      (hostPort: 8080 -> containerPort: {{ argocd_nodeport.stdout }}).
      For existing clusters, you may need to recreate the cluster with
      the configuration, or use kubectl port-forward.
  when: install_argocd

- name: Display ArgoCD server service
  ansible.builtin.command:
    argv: "{{ kubectl_base_command + ['get', 'service', 'argocd-server', '-n', 'argocd'] }}"
  register: argocd_service_info
  changed_when: false
  environment: "{{ argocd_proxy_env }}"
  when: install_argocd

- name: Show ArgoCD server service info
  ansible.builtin.debug:
    var: argocd_service_info.stdout_lines
  when: install_argocd

- name: Render argocd command params ConfigMap
  ansible.builtin.template:
    src: argocd-cmd-params-cm.yaml.j2
    dest: "{{ argocd_manifest_dir }}/argocd-cmd-params-cm.yaml"
    mode: '0644'
  register: argocd_cmd_params_template
  when: install_argocd

- name: Apply argocd command params ConfigMap
  ansible.builtin.command:
    argv: "{{ kubectl_base_command + ['apply', '-n', 'argocd', '-f', '/workspace/argocd-cmd-params-cm.yaml'] }}"
  register: argocd_cmd_params_apply
  changed_when: >
    (argocd_cmd_params_apply.stdout is defined)
    and
    (
      'configured' in argocd_cmd_params_apply.stdout
      or 'created' in argocd_cmd_params_apply.stdout
    )
  environment: "{{ argocd_proxy_env }}"
  when: install_argocd

- name: Restart ArgoCD server deployment to apply insecure setting
  ansible.builtin.command:
    argv: >-
      {{
        kubectl_base_command
        + [
          'rollout',
          'restart',
          'deployment',
          'argocd-server',
          '-n',
          'argocd'
        ]
      }}
  register: argocd_server_restart
  changed_when: >
    (argocd_server_restart.stdout is defined) and
    ('restarted' in argocd_server_restart.stdout or 'unchanged' not in argocd_server_restart.stdout)
  environment: "{{ argocd_proxy_env }}"
  when:
    - install_argocd
    - >
      (
        (argocd_cmd_params_template is defined and argocd_cmd_params_template.changed)
        or
        (argocd_cmd_params_apply is defined and argocd_cmd_params_apply.changed)
      )

- name: Wait for ArgoCD server deployment to become available after restart
  ansible.builtin.command:
    argv: "{{ kubectl_base_command + ['wait', '--for=condition=Available', '--namespace', 'argocd', 'deployment', 'argocd-server', '--timeout=300s'] }}"
  register: argocd_server_wait_after_restart
  changed_when: false
  environment: "{{ argocd_proxy_env }}"
  when:
    - install_argocd
    - argocd_server_restart is defined
    - argocd_server_restart.changed | default(false)

