[defaults]
inventory = inventory.yml
executable = /bin/bash
# cloudflared環境での接続安定性向上のための設定
timeout = 30
connect_timeout = 30
command_timeout = 60
retries = 5
# パイプライン処理を有効化（パフォーマンス向上）
pipelining = True
# facts収集を最適化
gathering = smart
# ホストキーチェック（必要に応じてFalseに変更可能）
host_key_checking = True

[ssh_connection]
ssh_args = -F ssh_config -o ServerAliveInterval=30 -o ServerAliveCountMax=5 -o ConnectTimeout=30
# コントロールパスの設定（接続の再利用）
control_path = ~/.ansible/cp/%%h-%%p-%%r
# 接続の再利用を有効化
control_path_dir = ~/.ansible/cp
